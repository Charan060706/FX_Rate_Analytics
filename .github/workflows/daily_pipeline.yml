name: Daily FX Pipeline

on:
  schedule:
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/793871106073/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'fx-pipeline-sa@currency-tracker-507607.iam.gserviceaccount.com'

      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r extract/requirements.txt
          pip install pandas-gbq google-cloud-bigquery-storage

      - name: Run Incremental Data Ingestion
        run: python extract/incremental.py

      - name: Install dbt BigQuery Adapter
        run: pip install dbt-bigquery

      - name: Run dbt Build
        run: |
          cd dbt_project
          dbt build --profiles-dir .